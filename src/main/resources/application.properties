spring.application.name=mephisto-hub-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/mephisto_hub
spring.datasource.username=mephisto
spring.datasource.password=dev_only_password

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only}
app.jwt.expiration-minutes=60