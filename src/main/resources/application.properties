spring.application.name=mephisto-hub-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/mephisto_hub
spring.datasource.username=mephisto
spring.datasource.password=dev_only_password

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-key-please-change-in-real-environments-1234567890}
app.jwt.expiration-minutes=60
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true
